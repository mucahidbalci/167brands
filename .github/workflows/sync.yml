name: katalog-sync

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 21 * * *"   # Türkiye saatiyle gece 00:00 (GitHub UTC kullanır)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ürünleri çek
        run: python scrape.py

      - name: Sonucu göster
        run: |
          echo "--- products.json boyutu ---"
          wc -c products.json
          echo "--- ilk 300 karakter ---"
          head -c 300 products.json

      - name: Commit ve push
        run: |
          git config user.name "katalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git commit -m "katalog senkron"
          git pull --rebase origin main
          git push
